name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bar108_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      APP_PORT: 8080
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bar108_test
      DB_SSLMODE: disable
      BAR108_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bar108_test?sslmode=disable
      JWT_SECRET: daef0e7d5c1e54a8601faf5c209bfe0b63f84014aa57fae5b993faf4ccbc5eb8
      JWT_EXPIRY_HOURS: 24

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Run tests with race detector
        run: go test -race -timeout 60s -count=1 ./...
        # -count=1 disables test caching — always runs fresh

      - name: Build binary
        run: go build -o bin/bar108 ./cmd/main.go

      - name: Build Docker image
        run: docker build -t bar108:${{ github.sha }} .

      - name: Validate production Compose configuration
        run: |
          mkdir -p secrets
          printf 'test-password\n' > secrets/db_password
          printf 'test-jwt-secret-32-bytes-minimum-1234\n' > secrets/jwt_secret
          printf 'https://example.com/alerts\n' > secrets/alert_webhook_url
          docker compose --env-file .env.production.example -f compose.production.yml config -q

      - name: Validate Caddy configuration
        run: docker run --rm -e BAR108_DOMAIN=api.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/amtool -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" -v "$PWD/secrets/alert_webhook_url:/run/secrets/alert_webhook_url:ro" prom/alertmanager:v0.35.0 check-config /etc/alertmanager/alertmanager.yml
